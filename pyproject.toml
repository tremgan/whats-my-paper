[project]
name = "whats-my-paper"
version = "0.1.0"
description = "Rename downloaded PDFs to their actual title"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "case-converter>=1.2.0",
    "docling>=2.115.0",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
    "typer>=0.24.2",
]


[project.scripts]
whats-my-paper = "whatsmypaper.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsmypaper"]