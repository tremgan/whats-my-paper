[project]
name = "whats-my-paper"
version = "0.1.1"
description = "Rename downloaded PDFs to their actual title"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tremgan" }]
keywords = ["pdf", "rename", "papers", "cli", "bibliography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "case-converter>=1.2.0",
    "docling>=2.115.0",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
    "typer>=0.24.2",
]


[dependency-groups]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/tremgan/whats-my-paper"
Repository = "https://github.com/tremgan/whats-my-paper"
Issues = "https://github.com/tremgan/whats-my-paper/issues"

[project.scripts]
whats-my-paper = "whatsmypaper.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsmypaper"]
