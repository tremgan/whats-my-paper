name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Test
        run: uv run pytest -v

      - name: Build and install the wheel
        run: |
          uv build
          uv tool install dist/*.whl
          # the tool bin dir isn't on PATH by default on the Windows runners
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Check the installed console script
        run: |
          whats-my-paper --help
          test "$(whats-my-paper --version)" = "$(uv version --short)"
